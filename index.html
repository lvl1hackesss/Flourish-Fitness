<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#faf8f4"><link rel="manifest" href="manifest.webmanifest"><title>Flourish 🦋</title><style>
:root{--cream:#faf8f4;--lav:#c9b6e4;--sage:#b8cdb5;--ink:#51445f;--blush:#f4dde4}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}main{max-width:620px;margin:auto;padding:18px 16px 105px}header{text-align:center;padding:10px 0 18px}.butterfly{font-size:42px}h1{font-family:Georgia,serif;font-size:38px;margin:0;font-weight:500}header p{margin:0;color:#80728c}h2{font:24px Georgia,serif;margin:6px 0 12px}h3{margin:6px 0 10px}.card{background:white;border-radius:21px;padding:18px;margin:13px 0;box-shadow:0 4px 20px #51445f0c}.muted{color:#847a8b;font-size:13px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.spread{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.pill,.btn{border:0;border-radius:13px;padding:12px 14px;background:#f0e9f8;color:var(--ink);font-weight:650;cursor:pointer}.btn{background:var(--lav)}.btn.secondary{background:#eef3eb}.btn.ghost{background:#f8f5fa}.pill.selected{outline:2px solid #8e70bd;background:#e8dcf6}.full{width:100%}button:disabled{opacity:.5}input,select,textarea{width:100%;border:1px solid #e6e0e9;border-radius:11px;padding:10px;font:inherit;color:var(--ink);background:white}label{display:block;font-size:13px;margin:9px 0 4px}.tabs{position:fixed;bottom:0;left:0;right:0;background:#fffefa;border-top:1px solid #eee8f1;display:flex;justify-content:center;padding:8px 4px max(10px,env(safe-area-inset-bottom));z-index:5}.tabs button{background:none;border:0;color:#817789;padding:7px 8px;flex:1;max-width:120px;font-size:11px}.tabs button.active{color:#7853a7;font-weight:bold}.tabs span{display:block;font-size:21px}.hide{display:none!important}.small{font-size:12px}.workoutItem{border:1px solid #eee8f1;border-radius:14px;padding:12px;margin:10px 0}.setrow{display:grid;grid-template-columns:28px 1fr 1fr 46px;gap:6px;align-items:center;margin:8px 0}.setrow input{min-width:0}.setrow button{padding:8px 4px}.note{background:#f5f2fa;border-radius:14px;padding:12px;margin:10px 0}.badge{background:#eef3eb;padding:5px 10px;border-radius:50px;font-size:12px}canvas{width:100%;height:170px}.divider{border:0;border-top:1px solid #eee8f1;margin:15px 0} .danger{color:#a44760} .center{text-align:center}</style></head><body><main><header><div class="butterfly">🦋</div><h1>Flourish</h1><p>Your fitness, your way.</p></header><section id="home"></section><section id="workouts" class="hide"></section><section id="nutrition" class="hide"></section><section id="progress" class="hide"></section><section id="settings" class="hide"></section></main><nav class="tabs" id="tabs"></nav><script>
const KEY='flourish-v1';const today=()=>new Date().toLocaleDateString('en-CA');const id=()=>Math.random().toString(36).slice(2,10);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const defaultTemplates=[{id:'A',name:'Lower Body & Glutes',ex:[['Barbell Squats',3,8,12],['Hip Thrusts',3,10,15],['Dumbbell Lunges',3,10,12],['Reverse Crunches',3,12,15],['Bicep Curls',3,10,12]]},{id:'B',name:'Upper Body & Core',ex:[['Light Goblet Squats',2,10,12],['Dumbbell Bench Press',3,8,12],['Shoulder Press',3,10,12],['Dumbbell Rows',3,10,12],['Hanging Knee Raises',3,8,12],['Dead Bugs',3,10,12]]},{id:'C',name:'Lower Body & Strength',ex:[['Barbell Squats',3,8,10],['Romanian Deadlifts',3,8,12],['Bulgarian Split Squats',3,8,10],['Reverse Crunches',3,12,15],['Dumbbell Chest Press',3,10,12]]},{id:'D',name:'Full Body & Core',ex:[['Light Squats',2,12,12],['Dumbbell Rows',3,10,12],['Hip Thrusts',3,10,12],['Hanging Knee Raises',3,8,12],['Bicep Curls',3,10,12],['Side Plank (seconds)',2,20,30]]}];
const initial=()=>({version:1,rotation:0,energy:{},workouts:[],checkins:[],meals:[],foods:[{id:id(),name:'Honey oats breakfast',kcal:'',protein:'',detail:'Uncle Tobys honey oats, cinnamon, heaped tsp honey; add milk/water and packet values'},{id:id(),name:'Rice Bubbles breakfast',kcal:'',protein:'',detail:'Rice Bubbles, raw sugar, milk; add quantities and packet values'}],templates:structuredClone(defaultTemplates),exerciseNames:[],notes:{}});let db;try{db=JSON.parse(localStorage.getItem(KEY))||initial()}catch{db=initial()}function save(){localStorage.setItem(KEY,JSON.stringify(db))}let tab='home',active=null;const $=x=>document.getElementById(x);const datefmt=s=>new Date(s+'T12:00:00').toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'});const next=()=>db.templates[db.rotation%db.templates.length];const btn=(text,action,cls='')=>`<button class="btn ${cls}" onclick="${action}">${text}</button>`;function render(){['home','workouts','nutrition','progress','settings'].forEach(x=>$(x).classList.toggle('hide',tab!==x));$('tabs').innerHTML=[['home','🏡','Home'],['workouts','🏋️','Workouts'],['nutrition','🍯','Nutrition'],['progress','📈','Progress'],['settings','⚙️','Settings']].map(([k,i,t])=>`<button class="${tab===k?'active':''}" onclick="go('${k}')"><span>${i}</span>${t}</button>`).join('');if(tab==='home')home();if(tab==='workouts')workouts();if(tab==='nutrition')nutrition();if(tab==='progress')progress();if(tab==='settings')settings()}function go(t){tab=t;render();window.scrollTo(0,0)}function setEnergy(v){db.energy[today()]=v;save();render()}function home(){let e=db.energy[today()],last=db.workouts.at(-1),latest=db.checkins.at(-1);$('home').innerHTML=`<div class="card"><div class="muted">${datefmt(today())}</div><h2>Every little step is growth. 💙</h2><div class="grid"><div class="note"><strong>${db.workouts.filter(w=>Date.now()-new Date(w.date).getTime()<7*864e5).length}</strong><div class="muted">Workouts, last 7 days</div></div><div class="note"><strong>${latest?.weight||'—'} ${latest?.weight?'kg':''}</strong><div class="muted">Latest weight</div></div></div></div><div class="card"><h2>How are you feeling today?</h2><div class="grid">${[['green','🟢 Feeling great'],['yellow','🟡 A little tired'],['orange','🟠 Low energy'],['red','🔴 Not my best']].map(([v,t])=>`<button class="pill ${e===v?'selected':''}" onclick="setEnergy('${v}')">${t}</button>`).join('')}</div>${e?`<p class="muted">${{green:'Feeling good? Take it at your own pace.',yellow:'No rush today.',orange:'A short session or rest may suit you.',red:'Your wellbeing comes first. Rest is always an option.'}[e]}</p>`:''}</div><div class="card"><h2>What would you like to do?</h2><div class="note"><strong>Continue your rotation: Day ${next().id}</strong><div class="muted">${esc(next().name)}</div></div>${btn('Start Day '+next().id,`start('${next().id}',true)`,'full')}<hr class="divider"><strong>🦋 Shake things up</strong><div class="grid" style="margin-top:9px">${btn('Choose a day',"go('workouts')",'secondary')}${btn('Surprise me!',"surprise()",'secondary')}</div><hr class="divider"><div class="grid">${btn('🌷 Short workout',"start('short',false)",'ghost')}${btn('🌿 Rest day',"restDay()",'ghost')}</div></div>${last?`<div class="card"><h3>Last workout</h3><div>${esc(last.name)} · ${datefmt(last.date.slice(0,10))}</div></div>`:''}<p class="center muted">🦋 Your progress will be here when you're ready.</p>`}function restDay(){if(!confirm('Mark today as a rest day?'))return;db.notes[today()]='Rest day';save();$('home').innerHTML=`<div class="card center" style="padding:40px 20px"><div style="font-size:56px">🦋</div><h2>Rest is part of growing.</h2><p><em>This too shall pass.</em></p><p>Rest up. Tomorrow is a new day, and your progress will still be here.</p>${btn('Back home',"render()",'secondary')}</div>`}function surprise(){start(db.templates[Math.floor(Math.random()*db.templates.length)].id,false)}function lastSet(name){for(let w of [...db.workouts].reverse()){let x=w.exercises.find(e=>e.name===name);if(x){let s=x.sets.find(s=>s.reps!==''||s.kg!=='');if(s)return `${s.kg||'—'} kg × ${s.reps||'—'} reps`}}return 'No previous record'}function start(which,rotation){let t=which==='short'?{id:'short',name:'Short Workout',ex:[['Weighted Squats',3,8,15],['Dumbbell Lunges',2,10,10],['Bicep Curls',2,10,12],['Reverse Crunches',2,10,12]]}:db.templates.find(t=>t.id===which);active={id:id(),name:t.name,date:new Date().toISOString(),rotation:rotation?which:null,energy:db.energy[today()]||'',notes:'',exercises:t.ex.map(([name,sets,min,max])=>({name,min,max,sets:Array.from({length:sets},()=>({kg:'',reps:'',done:false}))}))};go('workouts')}function updateSet(i,j,k,v){active.exercises[i].sets[j][k]=v}function toggleSet(i,j){active.exercises[i].sets[j].done=!active.exercises[i].sets[j].done;render()}function addExercise(){let n=prompt('Exercise name');if(!n?.trim())return;active.exercises.push({name:n.trim(),min:8,max:15,sets:Array.from({length:3},()=>({kg:'',reps:'',done:false}))});render()}function addSet(i){active.exercises[i].sets.push({kg:'',reps:'',done:false});render()}function removeEx(i){if(confirm('Remove this exercise from the current session?')){active.exercises.splice(i,1);render()}}function saveWorkout(){if(!active)return;active.notes=$('workoutNotes').value;db.workouts.push(active);if(active.rotation&&next().id===active.rotation)db.rotation=(db.rotation+1)%db.templates.length;save();active=null;alert('Workout saved! Every little step is growth. 🦋');go('home')}function workouts(){if(active){$('workouts').innerHTML=`<div class="card"><h2>${esc(active.name)}</h2><p class="muted">Record weight in kg and reps for each set. Tick when completed.</p>${active.exercises.map((ex,i)=>`<div class="workoutItem"><div class="row spread"><strong>${esc(ex.name)}</strong><button class="pill small" onclick="removeEx(${i})">Remove</button></div><div class="muted">Target: ${ex.sets.length} sets × ${ex.min}–${ex.max} · Previous: ${esc(lastSet(ex.name))}</div><div class="setrow muted"><span>Set</span><span>Weight (kg)</span><span>Reps</span><span>Done</span></div>${ex.sets.map((s,j)=>`<div class="setrow"><span>${j+1}</span><input type="number" inputmode="decimal" min="0" step="0.25" value="${esc(s.kg)}" oninput="updateSet(${i},${j},'kg',this.value)" aria-label="Weight for set ${j+1}"><input type="number" inputmode="numeric" min="0" value="${esc(s.reps)}" oninput="updateSet(${i},${j},'reps',this.value)" aria-label="Reps for set ${j+1}"><button class="pill ${s.done?'selected':''}" onclick="toggleSet(${i},${j})">${s.done?'✓':'○'}</button></div>`).join('')}<button class="pill" onclick="addSet(${i})">+ Set</button></div>`).join('')}${btn('+ Add exercise','addExercise()','secondary full')}<label>Workout notes</label><textarea id="workoutNotes" rows="2">${esc(active.notes)}</textarea><div class="grid" style="margin-top:12px">${btn('Save workout','saveWorkout()')}${btn('Discard',"if(confirm('Discard this workout?')){active=null;render()}",'ghost')}</div></div>`;return}$('workouts').innerHTML=`<div class="card"><h2>Workout rotation</h2><p class="muted">Choose any day. Only completing your suggested rotation day advances the rotation.</p>${db.templates.map(t=>`<div class="workoutItem"><strong>Day ${t.id} · ${esc(t.name)}</strong><div class="muted">${t.ex.map(x=>esc(x[0])).join(' · ')}</div><div style="margin-top:10px">${btn('Start Day '+t.id,`start('${t.id}',${next().id===t.id})`,'secondary')}</div></div>`).join('')}${btn('Start short workout',"start('short',false)",'full')}</div><div class="card"><h2>Workout history</h2>${db.workouts.length?[...db.workouts].reverse().map(w=>`<div class="note"><strong>${esc(w.name)}</strong><div class="muted">${datefmt(w.date.slice(0,10))} · ${w.exercises.length} exercises</div>${w.exercises.map(e=>`<div class="small">${esc(e.name)}: ${e.sets.filter(s=>s.done).map(s=>`${s.kg||'—'} kg × ${s.reps||'—'}`).join(', ')||'No completed sets'}</div>`).join('')}${w.notes?`<p class="small">${esc(w.notes)}</p>`:''}</div>`).join(''):'<p class="muted">Your first workout will appear here.</p>'}</div>`}function addFood(){let name=$('foodName').value.trim();if(!name)return alert('Enter a meal name');db.foods.push({id:id(),name,kcal:$('foodCal').value,protein:$('foodProtein').value,detail:$('foodDetail').value});save();render()}function logFood(fid){let f=db.foods.find(f=>f.id===fid);if(f.kcal===''){alert('Please add calorie information to this saved meal first.');return}db.meals.push({id:id(),date:today(),name:f.name,kcal:Number(f.kcal)||0,protein:Number(f.protein)||0});save();render()}function editFood(fid){let f=db.foods.find(f=>f.id===fid),k=prompt('Calories per usual serving (from packet/estimate)',f.kcal);if(k===null)return;let p=prompt('Protein (g) per serving',f.protein);if(p===null)return;f.kcal=k;f.protein=p;save();render()}function removeMeal(mid){db.meals=db.meals.filter(m=>m.id!==mid);save();render()}function nutrition(){let m=db.meals.filter(x=>x.date===today());$('nutrition').innerHTML=`<div class="card"><h2>Today's nutrition 🍯</h2><div class="grid"><div class="note"><strong>${Math.round(m.reduce((a,b)=>a+b.kcal,0))}</strong><div class="muted">Logged kcal</div></div><div class="note"><strong>${m.reduce((a,b)=>a+b.protein,0).toFixed(1)} g</strong><div class="muted">Logged protein</div></div></div><p class="muted">Optional estimates, not targets. Serving sizes and packaging information matter.</p>${m.map(x=>`<div class="row spread note"><span>${esc(x.name)} · ${x.kcal} kcal</span><button class="pill" onclick="removeMeal('${x.id}')">✕</button></div>`).join('')}</div><div class="card"><h2>Saved meals</h2>${db.foods.map(f=>`<div class="workoutItem"><strong>${esc(f.name)}</strong><div class="muted">${esc(f.detail)}${f.kcal!==''?' · '+esc(f.kcal)+' kcal':''}</div><div class="row" style="margin-top:9px">${btn('Add to today',`logFood('${f.id}')`,'secondary')}${btn('Edit nutrition',`editFood('${f.id}')`,'ghost')}</div></div>`).join('')}</div><div class="card"><h3>Save a new meal</h3><label>Meal name</label><input id="foodName" placeholder="e.g. Lunch"><div class="grid"><div><label>Calories per serving</label><input id="foodCal" type="number" min="0"></div><div><label>Protein (g)</label><input id="foodProtein" type="number" min="0" step="0.1"></div></div><label>Ingredients / notes</label><textarea id="foodDetail" rows="2"></textarea><div style="margin-top:12px">${btn('Save meal','addFood()','full')}</div></div>`}function addCheckin(){let fields=['weight','waist','band','hips','butt'];let item={id:id(),date:$('checkDate').value};fields.forEach(k=>item[k]=$('m_'+k).value);item.note=$('checkNote').value;db.checkins.push(item);db.checkins.sort((a,b)=>a.date.localeCompare(b.date));save();render()}function progress(){let fields=[['weight','Weight (kg)'],['waist','Waist (cm)'],['band','Bra band / underbust (cm)'],['hips','Hips (cm)'],['butt','Buttocks, widest point (cm)']];$('progress').innerHTML=`<div class="card"><h2>Weekly check-in 🌷</h2><label>Date</label><input type="date" id="checkDate" value="${today()}">${fields.map(([k,v])=>`<label>${v}</label><input id="m_${k}" type="number" step="0.1" min="0" inputmode="decimal" placeholder="Optional">`).join('')}<label>Notes (optional)</label><textarea id="checkNote" rows="2" placeholder="How you're feeling, travel, etc."></textarea><div style="margin-top:12px">${btn('Save check-in','addCheckin()','full')}</div></div><div class="card"><h2>Measurement history</h2>${db.checkins.length?[...db.checkins].reverse().map(c=>`<div class="note"><strong>${datefmt(c.date)}</strong><div class="small">${fields.filter(([k])=>c[k]).map(([k,v])=>`${v}: ${esc(c[k])}`).join(' · ')}</div>${c.note?`<div class="muted">${esc(c.note)}</div>`:''}</div>`).join(''):'<p class="muted">Your check-ins will appear here.</p>'}</div>`}function downloadBackup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='flourish-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function importBackup(el){let f=el.files[0];if(!f)return;f.text().then(t=>{let obj=JSON.parse(t);if(!Array.isArray(obj.workouts)||!Array.isArray(obj.checkins)||!Array.isArray(obj.templates))throw Error('Invalid Flourish backup');if(confirm('Replace all local Flourish data with this backup?')){db=obj;save();render();alert('Backup restored')}}).catch(e=>alert('Could not import backup: '+e.message))}function settings(){$('settings').innerHTML=`<div class="card"><h2>Your data 💾</h2><p>Flourish stores your information on this device in your browser. It does not synchronise between devices. Clearing website data can erase it.</p>${btn('⬇ Export backup','downloadBackup()','full')}<label>Restore a previous backup</label><input type="file" accept="application/json,.json" onchange="importBackup(this)"><p class="muted">Keep backups somewhere safe, such as Files or iCloud Drive. Export regularly.</p></div><div class="card"><h2>About Flourish 🦋</h2><p>Your fitness, your way.</p><p><em>Every little step is growth.</em></p><p class="muted">A gentle reminder: rest is progress too. If you're unusually sleepy or experiencing warning signs, avoid lifting weights and rest.</p></div>`}render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
